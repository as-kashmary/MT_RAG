[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --tb=short
markers =
    asyncio: mark test as async
    db: mark test as database-related
    integration: mark test as integration test
    unit: mark test as unit test
    slow: mark test as slow running
