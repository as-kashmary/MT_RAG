<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus RAG | Platform Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0f9ff', 100: '#e0f2fe', 500: '#0ea5e9', 600: '#0284c7', 900: '#0c4a6e' },
                        sidebar: '#0f172a'
                    }
                }
            }
        }
    </script>
</head>

<body class="bg-gray-50 font-sans text-slate-800 h-screen overflow-hidden flex">

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay" class="absolute inset-0 z-50 bg-gray-900 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden fade-in">
            <div class="bg-sidebar p-8 text-center">
                <i class="fa-solid fa-server text-brand-500 text-4xl mb-3"></i>
                <h1 class="text-2xl font-bold text-white">Platform Admin</h1>
                <p class="text-slate-400 text-sm mt-1">System & Tenant Management</p>
            </div>
            <form id="login-form" class="p-8 space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-700 uppercase mb-1">Admin Email</label>
                    <input type="email" required placeholder="sysadmin@nexus.com"
                        class="block w-full rounded-lg border-gray-300 bg-gray-50 border p-2.5 focus:border-brand-500 focus:ring-brand-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-700 uppercase mb-1">Password</label>
                    <input type="password" required placeholder="password"
                        class="block w-full rounded-lg border-gray-300 bg-gray-50 border p-2.5 focus:border-brand-500 focus:ring-brand-500">
                </div>
                <button type="submit"
                    class="w-full py-2.5 px-4 rounded-lg text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 transition-colors">Access
                    Dashboard</button>
            </form>
        </div>
    </div>

    <!-- SIDEBAR -->
    <aside class="bg-sidebar text-white w-64 flex-shrink-0 flex-col hidden md:flex">
        <div class="h-16 flex items-center px-6 border-b border-slate-700">
            <i class="fa-solid fa-layer-group text-brand-500 text-xl mr-3"></i>
            <span class="font-bold text-lg tracking-wide">Dotlines<span class="text-brand-500">Core</span></span>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <p class="px-2 text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2">Platform</p>
            <a href="#" class="flex items-center px-4 py-3 rounded-lg bg-brand-600 text-white shadow-md">
                <i class="fa-solid fa-chart-line w-6"></i> Dashboard
            </a>
            <a href="#"
                class="flex items-center px-4 py-3 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-white transition-colors">
                <i class="fa-solid fa-building w-6"></i> Companies
            </a>
        </nav>
        <div class="p-4 border-t border-slate-700 flex items-center">
            <div class="w-8 h-8 rounded-full bg-purple-500 flex items-center justify-center font-bold">SA</div>
            <div class="ml-3">
                <p class="text-sm font-medium text-white">Sys Admin</p>
                <button onclick="location.reload()" class="text-xs text-slate-400 hover:text-white">Sign Out</button>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="flex-1 flex flex-col h-full relative overflow-y-auto bg-gray-50 p-8">
        <div class="mb-8 flex justify-between items-end fade-in">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">System Overview</h2>
                <p class="text-gray-500 text-sm">Monitoring health and tenant products.</p>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8 fade-in">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-medium text-gray-500">Total Companies</h3>
                    <div class="p-2 bg-blue-50 rounded-lg"><i class="fa-solid fa-building text-blue-600"></i></div>
                </div>
                <p class="text-3xl font-bold text-gray-800">124</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-sm font-medium text-gray-500">Total Products</h3>
                    <div class="p-2 bg-indigo-50 rounded-lg"><i class="fa-solid fa-boxes-stacked text-indigo-600"></i>
                    </div>
                </div>
                <p class="text-3xl font-bold text-gray-800">312</p>
                <p class="text-xs text-gray-400 mt-1">Active AI Assistants</p>
            </div>
            <!-- ... other stats ... -->
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 fade-in">
            <!-- Main Chart -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-lg font-bold text-gray-800 mb-4">API Usage Trends</h3>
                <canvas id="platformChart" height="150"></canvas>
            </div>

            <!-- Tenant List -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Tenant Products</h3>
                <div id="tenant-list" class="space-y-4">
                    <!-- JS Injected Items -->
                </div>
            </div>
        </div>
    </main>

    <!-- External JS -->
    <script src="script.js"></script>
</body>

</html>
